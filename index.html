<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OC 도감</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfa; --card:#fff; --ink:#1c1d21; --sub:#6b6f78; --line:#e6e7ea; --soft:#f1f2f4; --ph:#ececef; --danger:#c2323f; --accent:#c8415a;
  --sans:'Pretendard',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:min(1120px,100% - 48px);margin:0 auto}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14.5px;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#34363d}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* 헤더 */
header{background:rgba(251,251,250,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.3px}
.menu{display:flex;gap:4px}
.menu a{padding:8px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--sub)}
.menu a:hover{background:var(--soft);color:var(--ink)}
.menu a.on{color:var(--ink);background:var(--soft)}
.menu small{margin-left:5px;font-size:12px;color:var(--sub);font-weight:400}
.navr{display:flex;align-items:center;gap:8px}
.adm{position:relative}
.admbtn{font-size:12.5px;color:var(--sub);padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.admbtn:hover{border-color:var(--ink);color:var(--ink)}
.admbtn i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.admmenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 18px 40px -16px rgba(20,22,30,.35);display:none;z-index:30}
.admmenu.on{display:block}
.admmenu p{word-break:keep-all;font-size:12px;color:var(--sub);padding:8px 10px 6px;line-height:1.5}
.admmenu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.admmenu button:hover{background:var(--soft)}
main{flex:1}
.top{padding:44px 0 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.8px}
.top p{color:var(--sub);margin-top:6px;font-size:15px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;width:260px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.search input::placeholder{color:#a1a5ad}
.search svg{width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:2;flex:none}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#c9cbd1;box-shadow:0 10px 26px -14px rgba(20,22,30,.28)}
.card .img{aspect-ratio:4/5;background:var(--ph);position:relative;overflow:hidden;display:grid;place-items:center}
.card .img img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;transition:transform .5s}
.card:hover .img img{transform:scale(1.04)}
.card .no{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.92);padding:3px 9px;border-radius:6px}
.ph{font-size:80px;font-weight:700;color:#bfc2c9}
.card .body{padding:16px 18px 18px}
.card .row{display:flex;align-items:baseline;gap:8px}
.card .nm{font-size:20px;font-weight:700;letter-spacing:-.4px}
.card .en{font-size:13px;color:var(--sub)}
.card .hl{margin-top:4px;font-size:14px;color:var(--sub)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tagrow u{text-decoration:none;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--soft);color:#4a4e57}
.empty{grid-column:1/-1;text-align:center;padding:90px 0;color:var(--sub)}
.empty .btn{margin-top:16px}

/* 세계관 */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding-bottom:80px}
.w{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.w h3{font-size:18px;font-weight:700;margin-bottom:6px}
.w p{color:var(--sub);font-size:15px;white-space:pre-wrap}
.w .acts{display:flex;gap:6px;margin-top:auto}

/* 상세 */
.dtop{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:10px}
.back{font-size:14px;color:var(--sub)}.back:hover{color:var(--ink)}
.d{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:56px;padding:26px 0 60px;align-items:start}
.pic{position:sticky;top:88px}
.frame{position:relative;background:var(--ph);border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:4/5;display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .ph{font-size:130px}
.zoom{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
.zoom:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcap{margin-top:10px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:10px}
.info .no{font-size:14px;font-weight:600;color:var(--sub)}
.info h1{font-size:clamp(40px,5vw,56px);font-weight:800;letter-spacing:-1.5px;line-height:1.15;margin-top:4px}
.info .en{margin-top:6px;color:var(--sub);font-size:17px}
.tabs{display:flex;gap:10px;margin-top:30px;border-bottom:1px solid var(--line)}
.tab{padding:10px 6px;margin-right:12px;font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--accent)}
.pane{display:none;padding-top:26px}.pane.on{display:block}
.lead{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.45}
.desc{margin-top:12px;color:#444851;font-size:16px;line-height:1.85;max-width:58ch;word-break:keep-all;white-space:pre-wrap}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sechead .sl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.sechead .code{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px;color:var(--accent);line-height:1}
.spec{margin-top:26px;border-top:1px solid var(--line)}
.spec div{display:grid;grid-template-columns:110px 1fr;padding:16px 4px;border-bottom:1px solid var(--line)}
.spec dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);padding-top:3px}
.spec dd{font-weight:600;font-size:15.5px}
.spec dd .en{font-weight:400;font-size:13.5px;color:var(--sub)}
.spec dd small{display:block;font-weight:400;font-size:13.5px;color:var(--sub);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.tag{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--soft);color:#4a4e57}
.acc{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.acc:first-of-type{margin-top:22px}
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:15.5px;font-weight:600;text-align:left}
.acc-btn:hover{background:var(--soft)}
.acc-btn i{font-style:normal;font-size:20px;font-weight:400;color:var(--sub);line-height:1}
.acc-box{display:none;padding:0 20px 20px;border-top:1px solid var(--line)}
.acc.open .acc-box{display:block}
.acc.open .acc-btn{background:var(--soft)}
.acc-box pre{margin-top:16px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.8;color:#34373e}
.acc-box .btn{margin-top:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal .gitem{position:relative;aspect-ratio:1}
.gal .gitem>button:first-child{width:100%;height:100%;border-radius:10px;overflow:hidden;background:var(--ph);border:1px solid var(--line);display:block}
.gdel{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(20,20,24,.78);color:#fff;font-size:15px;line-height:1;opacity:0;transition:opacity .15s}
.gitem:hover .gdel,.gdel:focus-visible{opacity:1}
@media(hover:none){.gdel{opacity:1}}
.galbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pbox{border:1px solid #2a2c33;border-radius:12px;background:#0e0f13;overflow:hidden;margin-bottom:14px}
.pbox-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #2a2c33}
.pbox-t{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8abb3;word-break:break-all}
.copy{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid #7a2e3c;color:#e0647c;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;letter-spacing:.1em}
.copy:hover{background:rgba(224,100,124,.12)}
.copy svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.pbox pre{margin:0;padding:18px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.8;color:#eceef2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.none{color:var(--sub)}
.pn{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:22px 0 64px}
.pn .sp{visibility:hidden}

/* 편집 폼 */
.form{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:48px;padding:10px 0 60px;align-items:start}
.uploader{position:sticky;top:88px}
.drop{aspect-ratio:4/5;border:1.5px dashed #c4c7ce;border-radius:14px;background:var(--card);display:grid;place-items:center;text-align:center;color:var(--sub);cursor:pointer;overflow:hidden;position:relative;font-size:14px}
.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.drop b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.uploader .btn{margin-top:10px;width:100%;justify-content:center}
.sec{margin-bottom:34px}
.sec>h2{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:#3a3d44}
.in,.ta{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-size:15px;outline:0}
.in:focus,.ta:focus{border-color:var(--ink)}
.ta{resize:vertical;min-height:110px;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srow{display:grid;grid-template-columns:90px 1fr 1fr 36px;gap:8px;margin-bottom:8px;align-items:center}
.x{width:36px;height:40px;border-radius:8px;color:var(--sub);font-size:18px}
.x:hover{background:var(--soft);color:var(--danger)}
.pblock{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);margin-bottom:12px}
.pblock .head{display:flex;gap:8px;margin-bottom:10px}
.gedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gedit div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.gedit img{width:100%;height:100%;object-fit:cover;display:block}
.gedit button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(20,20,24,.75);color:#fff;font-size:14px;line-height:1}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 0 24px;display:flex;gap:10px;justify-content:flex-end}

footer{border-top:1px solid var(--line);padding:20px 0 28px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer .fl{display:flex;gap:14px}
footer button{color:var(--sub);text-decoration:underline;text-underline-offset:3px}
footer button:hover{color:var(--ink)}

/* 다이얼로그 · 토스트 · 라이트박스 */
dialog{border:0;border-radius:16px;padding:26px;width:min(480px,calc(100% - 32px));margin:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,21,26,.45)}
dialog h2{font-size:18px;margin-bottom:16px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%)}
.lb{position:fixed;inset:0;background:rgba(15,16,20,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:40px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}

@media(max-width:820px){
  .wrap{width:calc(100% - 32px)}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .card .body{padding:12px 12px 14px}.card .nm{font-size:17px}
  .search{width:100%;order:2}.tools{width:100%}
  .d,.form{grid-template-columns:1fr;gap:28px}.pic,.uploader{position:static}
  .srow{grid-template-columns:1fr 1fr 36px}.srow .lb1{grid-column:1/3}
  .two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="#/">OC 도감</a>
  <div class="navr">
    <nav class="menu">
      <a id="mOC" href="#/">OC<small id="mOCn"></small></a>
      <a id="mW" href="#/world">Canon<small id="mWn"></small></a>
    </nav>
    <div class="adm" id="adm"></div>
  </div>
</div></header>
<main class="wrap" id="view"></main>
<footer class="wrap" id="foot"><span>나의 창작 기록</span></footer>

<dialog id="ld"><form id="lf">
  <h2>관리자 로그인</h2>
  <label class="f"><span>비밀번호</span><input class="in" id="lpw" type="password" autocomplete="off"></label>
  <p class="hint" id="lerr" style="color:var(--danger);display:none;margin:-6px 0 12px">비밀번호가 맞지 않아요.</p>
  <div class="acts"><button class="btn" type="button" id="lcancel">취소</button><button class="btn primary" type="submit">로그인</button></div>
</form></dialog>

<dialog id="gd"><form id="gf" onsubmit="return false">
  <h2>GitHub로 바로 올리기</h2>
  <label class="f"><span>깃허브 저장소 주소 (예: 아이디/저장소)</span><input class="in" id="gRepo" placeholder="luvme11/OC" autocomplete="off"></label>
  <label class="f"><span>토큰 (내 브라우저에만 저장돼요)</span><input class="in" id="gTok" type="password" autocomplete="off"></label>
  <label class="f"><span>올릴 파일 이름</span><input class="in" id="gPath" placeholder="index.html" autocomplete="off"></label>
  <p class="hint" id="gMsg" style="margin:-4px 0 12px"></p>
  <div class="acts"><button class="btn" type="button" id="gCancel">닫기</button><button class="btn primary" type="button" id="gGo">저장하고 올리기</button></div>
</form></dialog>

<dialog id="pd"><form id="pf" onsubmit="return false">
  <h2>비밀번호 바꾸기</h2>
  <label class="f"><span>새 비밀번호</span><input class="in" id="npw" type="text" autocomplete="off"></label>
  <div id="pout" style="display:none">
    <p class="hint" style="margin:0 0 8px">아래 한 줄을 복사하세요. 메모장으로 이 파일(index.html)을 열고 Ctrl+F로 <b>ADMIN_HASH</b> 를 검색해서, 찾은 줄 전체를 복사한 글로 바꾼 뒤 저장하면 끝이에요.</p>
    <textarea class="ta" id="pline" readonly="" style="min-height:72px;font-family:ui-monospace,Consolas,monospace;font-size:13px"></textarea>
  </div>
  <div class="acts" style="margin-top:12px"><button class="btn" type="button" id="pcancel">닫기</button><button class="btn" type="button" id="pcopy" style="display:none">복사</button><button class="btn primary" type="button" id="pmake">글자 만들기</button></div>
</form></dialog>



<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>
<input type="file" id="fileJson" accept="application/json,.json" hidden="">

<script>
const PRISTINE=document.documentElement.outerHTML;
/* =====================================================
   처음 한 번만 보이는 예시 데이터예요.
   이후에는 화면의 "새 캐릭터 / 수정" 버튼으로 직접 쓰면 돼요.
   ===================================================== */
const SEED = {
  characters:[
    {id:"yuan", ko:"유안", en:"Yuan", img:"images/yuan.jpg", caption:"Crimson & Silver",
     headline:"빨간 머리, 실버 눈동자.",
     desc:"긴 빨간 머리를 하프 업으로 정리한, 차분한 표정의 남성. 은빛 눈동자와 목에서 어깨에 걸친 문신이 특징.",
     settings:[{label:"머리",value:"크림슨 레드",sub:"롱 · 하프 업"},{label:"눈",value:"메탈릭 실버",sub:""},{label:"체형",value:"근육질",sub:"넓은 어깨 폭"},{label:"특징",value:"여러 피어싱",sub:"목, 어깨 문신"}],
     tags:["붉은 머리","실버 아이","문신"],
     prompts:[{title:"외모 프롬프트",text:"1boy, long crimson red hair, half up, metallic silver eyes, calm expression, muscular, wide shoulders, multiple piercings, neck and shoulder tattoo"}],
     gallery:[]},
    {id:"alru", ko:"아를", en:"Alru", img:"images/alru.jpg", caption:"Black & Gold",
     headline:"검은 여우 귀, 황금빛 눈.",
     desc:"단정한 일자 앞머리와 검은 여우 귀를 가진 소녀. 황금빛 눈동자가 인상적이다.",
     settings:[{label:"머리",value:"블랙",sub:"롱 · 일자 앞머리"},{label:"눈",value:"골드",sub:""},{label:"체형",value:"슬렌더",sub:""},{label:"특징",value:"여우 귀",sub:""}],
     tags:["검은 머리","여우 귀","금안"],

function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
const pwHash=pw=>h53(ADMIN_SALT+'|'+pw);

/* ---------- 저장소 (IndexedDB — 이미지가 많아도 넉넉해요) ---------- */
const idb={
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('oc-note',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});},
  async get(k){const db=await this.open();return new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);});}
};
let DB=null, canSave=true;
function migrate(){
  DB.characters=DB.characters||[];DB.world=DB.world||[];
  DB.world=DB.world.map(w=>w.ko!==undefined?w:{id:w.id,ko:w.title||'',en:'',img:'',caption:'',headline:'',desc:w.text||'',settings:[],tags:[],prompts:[],gallery:[],section:'',code:''});
  for(const c of [...DB.characters,...DB.world]){c.settings=c.settings||[];c.tags=c.tags||[];c.prompts=c.prompts||[];c.gallery=c.gallery||[];}
}
async function load(){
  let stored=null;
  try{ stored=await idb.get('data'); }catch(e){ canSave=false; }
  DB=ADMIN?(stored||PUBLISHED||structuredClone(SEED)):(PUBLISHED||stored||structuredClone(SEED));
  DB=structuredClone(DB);
  migrate();
}
async function save(){
  if(!ADMIN)return;
  if(!canSave){toast('이 브라우저에서는 저장할 수 없어요. 백업 내보내기를 이용해 주세요.');return;}
  try{await idb.set('data',DB);}catch(e){toast('저장에 실패했어요.');}
  try{renderAdmin();}catch(e){}
}

const $=s=>document.querySelector(s);
const p3=n=>String(n).padStart(3,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial=c=>esc((c.ko||'?')[0]);
const img=c=>c.img?`<img src="${esc(c.img)}" alt="${esc(c.ko)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${initial(c)}'}))">`:`<span class="ph">${initial(c)}</span>`;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}
function resize(file,max=1400){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onerror=no;
    r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',.86));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise((ok,no)=>{
    const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy')?ok():no();}catch(e){no(e);}
    a.remove();
  });
}

/* ---------- 관리자 · 백업 · 공개용 파일 ---------- */
function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function buildPublished(){
  const S='/*DATA_'+'START*/',E='/*DATA_'+'END*/';
  const a=PRISTINE.indexOf(S),b=PRISTINE.indexOf(E,a);
  if(a<0||b<0)return null;
  const json=JSON.stringify(DB).replace(/</g,'\\u003c');
  return '<!doctype html>\n'+PRISTINE.slice(0,a+S.length)+json+PRISTINE.slice(b);
}
function markPublished(){try{localStorage.setItem('oc-pub-sig',h53(JSON.stringify(DB)));}catch(e){}}
function publish(){
  const html=buildPublished();
  if(!html){toast('공개용 파일을 만들지 못했어요.');return;}
  markPublished();
  download('index.html',new Blob([html],{type:'text/html'}));
  toast('공개용 index.html을 만들었어요. 이 파일을 올리면 돼요.');
}
function b64(str){
  const bytes=new TextEncoder().encode(str);let bin='';const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function openGithub(){
  let g={};try{g=JSON.parse(localStorage.getItem('oc-gh')||'{}');}catch(e){}
  $('#gRepo').value=g.repo||'';$('#gTok').value=g.tok||'';$('#gPath').value=g.path||'index.html';
  $('#gMsg').textContent='';$('#gd').showModal();
}
async function pushGithub(){
  const msg=$('#gMsg');
  const repo=$('#gRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const tok=$('#gTok').value.trim();
  const path=($('#gPath').value.trim()||'index.html').replace(/^\/+/,'');
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){msg.textContent='저장소 주소를 "아이디/저장소" 모양으로 적어 주세요. 예: luvme11/OC';return;}
  if(!tok){msg.textContent='토큰을 넣어 주세요.';return;}
  try{localStorage.setItem('oc-gh',JSON.stringify({repo,tok,path}));}catch(e){}
  const html=buildPublished();
  if(!html){msg.textContent='파일을 만들지 못했어요.';return;}
  const btn=$('#gGo');btn.disabled=true;msg.textContent='올리는 중이에요... (이미지가 많으면 조금 걸려요)';
  const base=`https://api.github.com/repos/${repo}/contents/`;
  const enc=x=>x.split('/').map(encodeURIComponent).join('/');
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')):'';
    let sha;
    const g=await fetch(base+enc(dir),{headers:H});
    if(g.ok){const list=await g.json();const hit=Array.isArray(list)&&list.find(x=>x.path===path);if(hit)sha=hit.sha;}
    else if(g.status!==404)throw g;
    const r=await fetch(base+enc(path),{method:'PUT',headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Update OC dex',content:b64(html),...(sha?{sha}:{})})});
    if(!r.ok)throw r;
    markPublished();$('#gd').close();renderAdmin();
    toast('GitHub에 올렸어요! 1~2분 뒤 사이트에 반영돼요.');
  }catch(e){
    let t='올리지 못했어요.';
    const st=e&&e.status;
    if(st===401)t='토큰이 맞지 않아요. 다시 확인해 주세요.';
    else if(st===403)t='이 토큰에 쓰기 권한이 없어요. 토큰을 만들 때 Contents를 "Read and write"로 해 주세요.';
    else if(st===404)t='저장소를 찾지 못했어요. 주소와, 토큰을 만들 때 고른 저장소를 확인해 주세요.';
    else if(st===409||st===422)t='파일이 그 사이에 바뀌었어요. 한 번 더 눌러 보세요.';
    else if(e instanceof TypeError)t='연결하지 못했어요. 인터넷 상태를 확인해 주세요.';
    msg.textContent=t;
  }finally{btn.disabled=false;}
}

      <p>${dirty?'<b style="color:var(--accent)">방문자에게는 아직 안 보이는 변경이 있어요.</b><br>':''}수정한 내용은 이 브라우저에만 저장돼요. 방문자에게 보이려면 "GitHub로 바로 올리기"를 눌러 주세요.</p>
      <button id="gh" type="button">GitHub로 바로 올리기</button>
      <button id="pub" type="button">공개용 파일 받기 (직접 올릴 때)</button>
      <button id="exp" type="button">백업 내보내기</button>
      <button id="imp" type="button">백업 불러오기</button>
      <button id="pwc" type="button">비밀번호 바꾸기</button>
      <button id="lo" type="button">로그아웃</button>
    </div>`;
  const menu=$('#amenu'),close=()=>menu.classList.remove('on');
  $('#am').onclick=()=>menu.classList.toggle('on');
  $('#gh').onclick=()=>{close();openGithub();};
  $('#pub').onclick=()=>{close();publish();renderAdmin();};
  $('#exp').onclick=()=>{close();download('oc-note-backup.json',new Blob([JSON.stringify(DB)],{type:'application/json'}));};
  $('#imp').onclick=()=>{close();$('#fileJson').click();};
  $('#pwc').onclick=()=>{close();$('#npw').value='';$('#pout').style.display='none';$('#pcopy').style.display='none';$('#pd').showModal();};
  $('#lo').onclick=async()=>{
    close();ADMIN=false;try{localStorage.removeItem('oc-admin');}catch(e){}
    await load();toast('로그아웃했어요');CUR=null;go('#/');
  };
}
document.addEventListener('click',e=>{if(!e.target.closest('#adm')){const m=$('#amenu');if(m)m.classList.remove('on');}});
$('#lcancel').onclick=()=>$('#ld').close();
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();
  if(pwHash($('#lpw').value)!==ADMIN_HASH){$('#lerr').style.display='block';return;}
  ADMIN=true;try{localStorage.setItem('oc-admin',ADMIN_HASH);}catch(e2){}
  $('#ld').close();await load();toast('관리자 모드로 들어왔어요');CUR=null;go('#/');
});
$('#pcancel').onclick=()=>$('#pd').close();
$('#pmake').onclick=()=>{
  const v=$('#npw').value;if(!v){toast('새 비밀번호를 입력해 주세요.');return;}
  $('#pline').value=`const ADMIN_HASH='${pwHash(v)}';`;
  $('#pout').style.display='block';$('#pcopy').style.display='inline-flex';
};
$('#pcopy').onclick=async()=>{try{await copyText($('#pline').value);toast('복사했어요');}catch{toast('복사에 실패했어요');}};
$('#fileJson').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!ADMIN)return;
  try{
    const j=JSON.parse(await f.text());
    if(!Array.isArray(j.characters)||!Array.isArray(j.world))throw 0;
    if(!confirm('현재 내용이 백업 파일 내용으로 바뀌어요. 계속할까요?'))return;
    DB=j;migrate();await save();toast('불러왔어요');go('#/');
  }catch{toast('올바른 백업 파일이 아니에요.');}
};

/* ---------- 라이트박스 · 라우터 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lb]');
  if(b){$('#lbImg').src=b.dataset.lb;$('#lb').classList.add('on');return;}
  if(e.target.closest('#lb'))$('#lb').classList.remove('on');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on');});

let CUR=null,CURT=0;
function route(h){
  if(typeof h!=='string')h=location.hash.replace(/^#/,'')||'/';
  h=h.replace(/^#/,'')||'/';
  const now=Date.now();
  if(h===CUR&&now-CURT<80)return;
  CUR=h;CURT=now;
  renderAdmin();
  try{
    if(h==='/world')viewList('canon');
    else if(h==='/new')viewEdit(null,'oc');
    else if(h==='/wnew')viewEdit(null,'canon');
    else if(h.startsWith('/edit/'))viewEdit(h.slice(6),'oc');
    else if(h.startsWith('/wedit/'))viewEdit(h.slice(7),'canon');
    else if(h.startsWith('/c/'))viewDetail(h.slice(3),'a','oc');
    else if(h.startsWith('/w/'))viewDetail(h.slice(3),'a','canon');
    else viewList('oc');
  }catch(err){
    $('#view').innerHTML='<div class="empty">화면을 그리는 중 오류가 났어요.<br>'+esc(err&&err.message)+'<br><a class="btn" href="#/">처음으로</a></div>';
  }
  window.scrollTo(0,0);
}
function go(h){try{history.replaceState(null,'',h);}catch(e){try{location.hash=h;}catch(e2){}}route(h);}
/* 링크를 눌러도 실제로 페이지가 이동하지 않고 화면만 바꿔요 (사이트에 끼워 넣어도 동작) */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');
  if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();go(a.getAttribute('href'));
});
addEventListener('hashchange',route);
load().then(route);
</script></body></html>
